# Optional: keep component and IDF dependencies up to date
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "gitsubmodule"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5

  # Uncomment and adjust if you use a lockfile or manifest for components
  # - package-ecosystem: "nuget"
  #   directory: "/"
  #   schedule:
  #     interval: "monthly"
