## IDF Component Manager Manifest File for minimal example
## This file allows the example to use components from the Component Manager

dependencies:
  # Stream Video SDK dependencies
  espressif/esp_peer: "^1.2.7"
  espressif/esp_capture: "*"
  
  # WebSocket client (required for signaling)
  espressif/esp_websocket_client: "^1.6.1"
  
  # Protobuf implementation (using LiveKit's nanopb from registry)
  livekit/nanopb: "^0.4.9"
  
  # Note: av_render and media_lib_os might be part of ESP-IDF itself
  # or may need to be added manually. Check ESP-IDF documentation.
