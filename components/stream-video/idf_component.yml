## IDF Component Manager Manifest File
## https://docs.espressif.com/projects/idf-component-manager/en/latest/reference/manifest_file.html

version: "0.1.0"
description: "Stream Video SDK for ESP32 — real-time video, audio, and signaling over WebRTC"
url: "https://github.com/GetStream/stream-video-esp32"
repository: "https://github.com/GetStream/stream-video-esp32.git"
license: "Apache-2.0"
targets:
  - esp32s3
  - esp32p4

dependencies:
  espressif/esp_peer: "^1.2.7"
  espressif/esp_capture: "*"
  espressif/esp_websocket_client: "^1.6.1"
  espressif/cjson: "*"
  livekit/nanopb: "^0.4.9"
  espressif/esp_video_codec: "*"
  espressif/esp_audio_codec: "*"
